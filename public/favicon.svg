<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Minimal dark ink background with subtle rounded corners -->
  <rect width="100" height="100" rx="18" fill="#1D2B26"/>
  <!-- "AJ." text centered. Using a clean sans-serif (system font stack), bold, tracking tighter -->
  <text 
    x="48%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="800" 
    font-size="44" 
    letter-spacing="-1.5"
    fill="#FDFBF7"
  >
    AJ<tspan fill="#C45E28">.</tspan>
  </text>
</svg>
